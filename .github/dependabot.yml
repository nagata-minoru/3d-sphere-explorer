# 依存パッケージの更新PRを週1回作る
# 公開から14日たっていない版は使わない（cooldown）。PRはセキュリティ更新も含めて、エコシステムごとに1つにまとめる
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    # package.json の three はテスト用で、本番は index.html と vite.config.js の CDN の URL から読み込む。
    # ここだけ上がると本番とテストの版がずれるので、上げるときは 3 か所を手で揃える
    ignore:
      - dependency-name: three
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
